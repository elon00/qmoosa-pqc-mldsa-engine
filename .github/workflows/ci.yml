name: Post-Quantum Digital Signature Engine CI Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout engine repository
        uses: actions/checkout@v4
        with:
          path: qmoosa-pqc-mldsa-engine

      - name: Checkout protocol repository
        uses: actions/checkout@v4
        with:
          repository: elon00/qmoosa-pqc-mldsa-protocol
          ref: main
          path: qmoosa-pqc-mldsa-protocol

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install and build protocol dependency
        run: |
          cd qmoosa-pqc-mldsa-protocol
          npm install
          npm run build

      - name: Install dependencies in engine
        run: |
          cd qmoosa-pqc-mldsa-engine
          npm install

      - name: Build TypeScript
        run: |
          cd qmoosa-pqc-mldsa-engine
          npm run build

      - name: Run Engine Cryptographic Test Suite
        run: |
          cd qmoosa-pqc-mldsa-engine
          npm test

      - name: Static Type & Lint Check
        run: |
          cd qmoosa-pqc-mldsa-engine
          npm run lint
